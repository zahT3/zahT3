name: relay

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

# One move at a time: two people answering at once must not both win.
concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  play:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: game
        run: python3 game/game.py play
      - if: steps.game.outputs.message != ''
        env:
          MESSAGE: ${{ steps.game.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json assets/relay.svg README.md
          git commit -m "$MESSAGE"
          git push
      # Comments go out only after the new state is pushed, so nobody is told a layer is live before it is.
      - run: python3 game/game.py notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
